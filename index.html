<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a6d45'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h16M15 8v16' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<title>Booking Entry Tables</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#23201c;--mute:#7a736a;--line:#e7e1d8;--brand:#c2410c;--bi:#fff;--bs:#fff1e8;--field:#faf8f5;--side:#fbf9f6;
--soon:#b45309;--soonbg:#fef3c7;--done:#15803d;--donebg:#dcfce7;--call:#1d4ed8;--callbg:#dbeafe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#121110;--card:#1c1a17;--ink:#f1ece4;--mute:#9a9186;--line:#322d26;--brand:#fb923c;--bi:#1a1208;--bs:#2a1c10;--field:#24211c;--side:#181613;
--soon:#fbbf24;--soonbg:#3a2a08;--done:#4ade80;--donebg:#0f2e1a;--call:#60a5fa;--callbg:#0f2240}}
:root[data-theme="night"]{--bg:#121110;--card:#1c1a17;--ink:#f1ece4;--mute:#9a9186;--line:#322d26;--brand:#fb923c;--bi:#1a1208;--bs:#2a1c10;--field:#24211c;--side:#181613;
--soon:#fbbf24;--soonbg:#3a2a08;--done:#4ade80;--donebg:#0f2e1a;--call:#60a5fa;--callbg:#0f2240}
:root[data-theme="royal"]{--bg:#15122a;--card:#1f1b3d;--ink:#ece9ff;--mute:#9a95c4;--line:#342f5e;--brand:#a78bfa;--bi:#14102b;--bs:#2a2452;--field:#262150;--side:#1a1635;
--soon:#fbbf24;--soonbg:#3a2a08;--done:#4ade80;--donebg:#0f2e1a;--call:#60a5fa;--callbg:#0f2240}
:root[data-theme="ocean"]{--bg:#eaf4f8;--card:#fff;--ink:#0f2a38;--mute:#5b7a89;--line:#d3e5ec;--brand:#0e7490;--bs:#e0f4f9;--field:#f4fafc;--side:#dff0f6}
:root[data-theme="forest"]{--bg:#eef3ec;--card:#fff;--ink:#1b2a1e;--mute:#66786a;--line:#d9e4d6;--brand:#2f7d4f;--bs:#e5f3e9;--field:#f6faf5;--side:#e2ecdf}
:root[data-theme="rose"]{--bg:#fbeff1;--card:#fff;--ink:#3a1e25;--mute:#8a6670;--line:#f1d9de;--brand:#be185d;--bs:#fde7ee;--field:#fdf6f8;--side:#f8e3e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:12px}
.brand{font-size:18px;font-weight:800;letter-spacing:-.3px}
.clock{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;transition:.15s}
button:hover{border-color:var(--brand)}
.primary{background:var(--brand);border-color:var(--brand);color:var(--bi);font-weight:600}
.primary:hover{filter:brightness(1.08)}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.nform{display:none;flex-direction:column;gap:8px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.nform.open{display:flex}.nform div{display:flex;gap:8px}.nform .primary{flex:1}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute);margin-top:4px}
#list{display:flex;flex-direction:column;gap:6px;flex:1}
.titem{text-align:left;display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:12px;background:transparent;border-color:transparent}
.titem b{font-size:14px;font-weight:650}.titem small{color:var(--mute);font-size:12px}
.titem:hover{background:var(--card)}
.titem.on{background:var(--card);border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--ink);transform:scale(1.1)}
.main{padding:22px 20px 60px;min-width:0}
.mh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tname{flex:1;min-width:200px;font-size:24px;font-weight:800;letter-spacing:-.3px;border:1px dashed transparent;background:transparent;border-radius:10px;padding:4px 8px}
.tname:hover,.tname:focus{border-color:var(--brand);background:var(--card);outline:none}
.meta{color:var(--mute);font-size:12px;width:100%;padding-left:8px;margin-top:-6px}
.danger:hover{border-color:#dc2626;color:#dc2626}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.pill{padding:7px 14px;border-radius:999px;font-weight:650;font-size:13px}
.p-all{background:var(--brand);color:var(--bi);font-size:15px}
.p-soon{background:var(--soonbg);color:var(--soon)}.p-done{background:var(--donebg);color:var(--done)}.p-call{background:var(--callbg);color:var(--call)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:780px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);padding:11px 12px;border-bottom:1px solid var(--line);background:var(--bs)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--field)}
.no{color:var(--mute);font-size:12px;width:34px;padding-top:15px}
.time{font:700 14px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;padding-top:14px;width:92px;font-variant-numeric:tabular-nums}
.dim{color:var(--mute);font-weight:400;font-size:12px;font-family:inherit}
.cust{width:150px}
.item{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.item .bid{width:140px}.item .amt{width:105px}
.item select{font-weight:650;border-radius:999px;padding:7px 10px}
select[data-s="Book Soon"]{background:var(--soonbg);color:var(--soon)}
select[data-s="Booking Done"]{background:var(--donebg);color:var(--done)}
select[data-s="Take on Call"]{background:var(--callbg);color:var(--call)}
.x{padding:4px 9px;color:var(--mute)}
.add{font-size:13px;padding:5px 10px;border-style:dashed;color:var(--brand)}
.rt{font-weight:700;white-space:nowrap;text-align:right;padding-top:14px}
.addrows{display:flex;gap:8px;align-items:center;padding:14px;background:var(--field)}
.addrows input{width:70px}
.empty{text-align:center;color:var(--mute);padding:60px 10px;border:2px dashed var(--line);border-radius:16px}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}
#list{flex-direction:row;overflow-x:auto;flex:none}.titem{min-width:170px;border-color:var(--line)}.main{padding:16px 12px 50px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">📒 Booking Tables</div>
<div class="clock" id="clock"></div>
<button class="primary" data-a="newBtn">+ New Table</button>
<div class="nform" id="nform"><input id="nname" placeholder="Table name"><div><button class="primary" data-a="create">Create</button><button data-a="cancel">Cancel</button></div></div>
<div class="lbl">Your tables</div>
<div id="list"></div>
<div class="lbl">Theme</div>
<div class="themes" id="themes"></div>
</aside>
<main class="main" id="main"></main>
</div>
<script>
var STATUS=["Book Soon","Booking Done","Take on Call"];
var KEY="booking_entry_tables_v1",TKEY="booking_entry_theme_v1";
var THEMES=[["auto","Auto","linear-gradient(135deg,#f4f1ec 50%,#121110 50%)"],["light","Day","linear-gradient(135deg,#f4f1ec 50%,#c2410c 50%)"],["night","Night","linear-gradient(135deg,#121110 50%,#fb923c 50%)"],["ocean","Ocean","linear-gradient(135deg,#eaf4f8 50%,#0e7490 50%)"],["forest","Forest","linear-gradient(135deg,#eef3ec 50%,#2f7d4f 50%)"],["rose","Rose","linear-gradient(135deg,#fbeff1 50%,#be185d 50%)"],["royal","Royal","linear-gradient(135deg,#15122a 50%,#a78bfa 50%)"]];
var S={tables:[],active:null};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)||S;}catch(e){}
if(!S.tables)S.tables=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function hm(d){d=d||new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function inr(n){return "₹"+(Math.round(n*100)/100).toLocaleString("en-IN")}
function dname(){return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+", "+hm()}
function newItem(){return{id:"",status:"Book Soon",amt:""}}
function blankRow(){return{id:uid(),time:"",cust:"",items:[newItem()]}}
function mk(name){var rows=[];for(var i=0;i<10;i++)rows.push(blankRow());return{id:uid(),name:name||dname(),created:dname(),rows:rows}}
function tbl(id){return S.tables.find(function(t){return t.id===id})}
function cur(){return tbl(S.active)||S.tables[0]}
function totals(t){var r={all:0,n:0,s:{}};STATUS.forEach(function(s){r.s[s]={a:0,n:0}});
t.rows.forEach(function(row){row.items.forEach(function(i){var a=parseFloat(i.amt)||0;if(!i.id.trim()&&!a)return;r.all+=a;r.n++;var o=r.s[i.status]||r.s["Book Soon"];o.a+=a;o.n++})});return r}
function rowSum(r){return r.items.reduce(function(a,i){return a+(parseFloat(i.amt)||0)},0)}
function statsHtml(t){var x=totals(t);
return '<span class="pill p-all">Total '+inr(x.all)+' · '+x.n+' bookings</span>'
+'<span class="pill p-done">Done '+inr(x.s["Booking Done"].a)+' ('+x.s["Booking Done"].n+')</span>'
+'<span class="pill p-soon">Book Soon '+inr(x.s["Book Soon"].a)+' ('+x.s["Book Soon"].n+')</span>'
+'<span class="pill p-call">On Call '+inr(x.s["Take on Call"].a)+' ('+x.s["Take on Call"].n+')</span>'}
function renderList(){document.getElementById("list").innerHTML=S.tables.length?S.tables.map(function(t){
var n=t.rows.filter(function(r){return r.time}).length;
return '<button class="titem'+(cur()&&t.id===cur().id?' on':'')+'" data-a="pick" data-t="'+t.id+'"><b>'+esc(t.name||"Untitled")+'</b><small>'+n+' entries · '+inr(totals(t).all)+'</small></button>'}).join(""):'<small class="dim">No tables yet</small>'}
function itemHtml(t,r,i,it){var a='data-t="'+t+'" data-r="'+r+'" data-i="'+i+'"';
return '<div class="item"><input class="bid" placeholder="Booking ID" value="'+esc(it.id)+'" '+a+' data-f="id">'
+'<input class="amt" type="number" min="0" placeholder="Amount ₹" value="'+esc(it.amt)+'" '+a+' data-f="amt">'
+'<select data-s="'+esc(it.status)+'" '+a+' data-f="status">'+STATUS.map(function(s){return '<option'+(s===it.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select>'
+'<button class="x" title="Remove this booking ID" data-a="delItem" '+a+'>✕</button></div>'}
function timeHtml(r){return r.time?esc(r.time)+' 🔒':'<span class="dim">auto</span>'}
function renderMain(){var m=document.getElementById("main"),t=cur();
if(!t){m.innerHTML='<div class="empty">No tables yet. Click <b>+ New Table</b> to start.</div>';return}
m.innerHTML='<div class="mh"><input class="tname" value="'+esc(t.name)+'" data-t="'+t.id+'" data-f="tname"><button data-a="csv" data-t="'+t.id+'">⬇ Export CSV</button><button class="danger" data-a="delTable" data-t="'+t.id+'">Delete table</button><div class="meta">Created '+esc(t.created)+'</div></div>'
+'<div class="stats" id="ft">'+statsHtml(t)+'</div><div class="card"><div class="scroll"><table><thead><tr><th>#</th><th>Time</th><th>Customer No.</th><th>Booking IDs · Amount · Status</th><th style="text-align:right">Row total</th><th></th></tr></thead><tbody>'
+t.rows.map(function(r,idx){return '<tr><td class="no">'+(idx+1)+'</td><td class="time" id="tm-'+r.id+'">'+timeHtml(r)+'</td>'
+'<td><input class="cust" inputmode="tel" placeholder="Customer number" value="'+esc(r.cust)+'" data-t="'+t.id+'" data-r="'+r.id+'" data-f="cust"></td>'
+'<td>'+r.items.map(function(it,i){return itemHtml(t.id,r.id,i,it)}).join("")+'<button class="add" data-a="addItem" data-t="'+t.id+'" data-r="'+r.id+'">+ booking ID</button></td>'
+'<td class="rt" id="rs-'+r.id+'">'+inr(rowSum(r))+'</td><td><button class="x danger" title="Delete row" data-a="delRow" data-t="'+t.id+'" data-r="'+r.id+'">🗑</button></td></tr>'}).join("")
+'</tbody></table></div><div class="addrows"><button class="primary" data-a="addRows" data-t="'+t.id+'">+ Add rows</button><input id="addN" type="number" min="1" max="200" value="5"><span class="dim">rows to add</span></div></div>'}
function renderAll(){renderList();renderMain()}
function row(t,r){return t.rows.find(function(x){return x.id===r})}
var main=document.getElementById("main");
main.addEventListener("input",function(e){var el=e.target,f=el.dataset.f;if(!f)return;var t=tbl(el.dataset.t);if(!t)return;
if(f==="tname"){t.name=el.value;save();renderList();return}
var r=row(t,el.dataset.r);if(!r)return;
if(f==="cust")r.cust=el.value;else{r.items[+el.dataset.i][f]=el.value;if(f==="status")el.dataset.s=el.value}
if(!r.time&&(r.cust.trim()||r.items.some(function(i){return i.id.trim()||i.amt}))){r.time=hm();document.getElementById("tm-"+r.id).innerHTML=timeHtml(r)}
document.getElementById("rs-"+r.id).textContent=inr(rowSum(r));
document.getElementById("ft").innerHTML=statsHtml(t);save();renderList()});
document.addEventListener("click",function(e){var b=e.target.closest("[data-a],[data-th]");if(!b)return;
if(b.dataset.th){setTheme(b.dataset.th);return}
var a=b.dataset.a,t=tbl(b.dataset.t),rid=b.dataset.r;
if(a==="newBtn"){var f=document.getElementById("nform");f.classList.toggle("open");document.getElementById("nname").value=dname();return}
if(a==="cancel"){document.getElementById("nform").classList.remove("open");return}
if(a==="create"){var nm=document.getElementById("nname").value.trim()||dname();var nt=mk(nm);S.tables.unshift(nt);S.active=nt.id;save();document.getElementById("nform").classList.remove("open");renderAll();return}
if(a==="pick"){S.active=b.dataset.t;save();renderAll();return}
if(!t)return;
if(a==="addItem"){row(t,rid).items.push(newItem());save();renderMain()}
else if(a==="delItem"){var r=row(t,rid),i=+b.dataset.i;if(r.items.length>1)r.items.splice(i,1);else r.items=[newItem()];save();renderAll()}
else if(a==="delRow"){var rr=row(t,rid);if(!rr.time||confirm("Delete this row?")){t.rows=t.rows.filter(function(x){return x.id!==rid});save();renderAll()}}
else if(a==="addRows"){var n=Math.max(1,Math.min(200,parseInt(document.getElementById("addN").value)||1));for(var k=0;k<n;k++)t.rows.push(blankRow());save();renderAll()}
else if(a==="delTable"){if(confirm("Delete the whole table “"+t.name+"”?")){S.tables=S.tables.filter(function(x){return x.id!==t.id});S.active=S.tables.length?S.tables[0].id:null;save();renderAll()}}
else if(a==="csv")exportCsv(t)});
function q(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(t){var L=[["Time","Customer Number","Booking ID","Status","Amount"].join(",")];
t.rows.forEach(function(r){r.items.forEach(function(i){if(!i.id.trim()&&!i.amt)return;L.push([r.time,r.cust,i.id,i.status,i.amt||0].map(q).join(","))})});
L.push(["","","","Total",totals(t).all].map(q).join(","));
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}));
a.download=(t.name||"table").replace(/[^\w\- ]+/g,"").trim()+".csv";document.body.appendChild(a);a.click();a.remove()}
function setTheme(n){var d=document.documentElement;if(n==="auto")d.removeAttribute("data-theme");else d.setAttribute("data-theme",n);
try{localStorage.setItem(TKEY,n)}catch(e){}
document.getElementById("themes").innerHTML=THEMES.map(function(t){return '<button class="sw'+(t[0]===n?' on':'')+'" title="'+t[1]+'" style="background:'+t[2]+'" data-th="'+t[0]+'"></button>'}).join("")}
var th="auto";try{th=localStorage.getItem(TKEY)||"auto"}catch(e){}
setTheme(th);
function tick(){var d=new Date();document.getElementById("clock").textContent="🕐 "+hm(d)+":"+pad(d.getSeconds())}
tick();setInterval(tick,1000);
if(!S.tables.length){var f=mk();S.tables.push(f);S.active=f.id;save()}
renderAll();
</script>
</body>
</html>
