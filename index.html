<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Sheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a6d45'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h16M15 8v16' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before first paint so there is no flash
  try { var t = localStorage.getItem('ttbs_theme_v1'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
  :root {
    --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --rh: 38px;   /* data row height */
    --lh: 26px;   /* column-letter row height */
    color-scheme: light;

    --page-a: #0a3324; --page-b: #135439;
    --on-page: #eef8f2; --on-page-dim: #a3cbb4;
    --ctl: rgba(255,255,255,.12); --ctl-line: rgba(255,255,255,.26); --ctl-hover: rgba(255,255,255,.22);
    --btn-primary-bg: #ffffff; --btn-primary-fg: #0f4a31;

    --sheet: #ffffff; --edge: rgba(0,0,0,.28);
    --text: #12261c; --dim: #71877b; --grid: #d4e1d9;
    --head: #ebf4ef; --head-text: #365244; --head-active: #cde6d9; --hover: #f3f9f5;
    --accent: #1e7d4f; --accent-fg: #ffffff;
    --label-bg: #1a6d45; --label-fg: #ffffff;
    --bar: #155a3b; --bar-fg: #dff3e7;
    --shadow: 0 28px 60px -24px rgba(0,0,0,.6);

    --call-bg: #dbeafe; --call-fg: #1d3f9a;
    --soon-bg: #fdecc0; --soon-fg: #8a4a05;
    --done-bg: #cdf0dc; --done-fg: #0b5a35;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-a: #000000; --page-b: #000000;
    --on-page: #e6efe9; --on-page-dim: #7f978b;
    --ctl: #0b0f0d; --ctl-line: #1f2b25; --ctl-hover: #141c18;
    --btn-primary-bg: #3fd18b; --btn-primary-fg: #03170e;

    --sheet: #0a0d0b; --edge: #1c2721;
    --text: #e4eee8; --dim: #768c81; --grid: #1a231e;
    --head: #0f1512; --head-text: #9db7a9; --head-active: #15301f; --hover: #0f1512;
    --accent: #3fd18b; --accent-fg: #03170e;
    --label-bg: #0f2a1d; --label-fg: #bff0d5;
    --bar: #0d1511; --bar-fg: #9db7a9;
    --shadow: none;

    --call-bg: #10284a; --call-fg: #9cc4ff;
    --soon-bg: #3a2a07; --soon-fg: #f7cf6a;
    --done-bg: #0a3320; --done-fg: #77e0aa;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--on-page);
    background: linear-gradient(160deg, var(--page-a), var(--page-b)) fixed;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  .app {
    height: 100dvh; max-width: 1000px; margin: 0 auto;
    padding: 16px 20px 18px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ---------- Title bar ---------- */
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark {
    width: 38px; height: 38px; border-radius: 9px; flex: none;
    background: var(--btn-primary-bg); color: var(--btn-primary-fg);
    display: grid; place-items: center;
  }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--on-page-dim); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn {
    height: 36px; padding: 0 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--ctl-line); background: var(--ctl); color: var(--on-page);
    font: 600 13.5px var(--font); transition: background .15s;
  }
  .btn:hover { background: var(--ctl-hover); }
  .btn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: transparent; }
  .btn.primary:hover { filter: brightness(.94); background: var(--btn-primary-bg); }
  .icon-btn { width: 36px; padding: 0; display: grid; place-items: center; }
  .icon-btn .sun { display: none; }
  :root[data-theme="dark"] .icon-btn .sun { display: block; }
  :root[data-theme="dark"] .icon-btn .moon { display: none; }
  .btn:focus-visible, .chip:focus-visible, .banner button:focus-visible {
    outline: 2px solid var(--on-page); outline-offset: 2px;
  }

  /* ---------- Banner ---------- */
  .banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 8px 9px 14px; border-radius: 8px; font-size: 13.5px;
    background: #fdecc0; color: #6b3a03;
  }
  :root[data-theme="dark"] .banner { background: #3a2a07; color: #f7cf6a; }
  .banner button { background: none; border: 0; color: inherit; cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 4px; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .namebox {
    min-width: 58px; height: 36px; padding: 0 12px; display: grid; place-items: center;
    border: 1px solid var(--ctl-line); background: var(--ctl); border-radius: 6px;
    font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums;
  }
  .search {
    flex: 1 1 220px; min-width: 190px; height: 36px; padding: 0 11px;
    display: flex; align-items: center; gap: 8px; border-radius: 6px;
    background: var(--ctl); border: 1px solid var(--ctl-line); color: var(--on-page-dim);
  }
  .search:focus-within { border-color: var(--on-page); }
  .search input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none;
    color: var(--on-page); font: 500 14px var(--font);
  }
  .search input::placeholder { color: var(--on-page-dim); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--ctl-line); background: var(--ctl); color: var(--on-page);
    font: 600 13px var(--font); transition: background .15s;
  }
  .chip:hover { background: var(--ctl-hover); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip[data-f="call"] .dot { background: #5aa2ff; }
  .chip[data-f="soon"] .dot { background: #f5b73b; }
  .chip[data-f="done"] .dot { background: #34d399; }
  .chip .n { font-variant-numeric: tabular-nums; opacity: .75; font-weight: 500; }
  .chip[aria-pressed="true"] { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: transparent; }
  .chip[aria-pressed="true"] .n { opacity: .8; }

  /* ---------- Workbook card ---------- */
  .book {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--sheet); color: var(--text);
    border: 1px solid var(--edge); border-radius: 10px; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .sheet-wrap { flex: 1; overflow: auto; scroll-padding-top: 70px; scroll-padding-left: 60px; overscroll-behavior: contain; }

  table.sheet { width: 100%; min-width: 540px; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  .sheet th, .sheet td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 0; }
  .sheet th:last-child, .sheet td:last-child { border-right: 0; }

  .sheet thead th { position: sticky; z-index: 3; }
  .sheet thead tr.letters th {
    top: 0; height: var(--lh); line-height: calc(var(--lh) - 1px);
    background: var(--head); color: var(--head-text); font-size: 12px; font-weight: 600; text-align: center;
  }
  .sheet thead tr.labels th {
    top: var(--lh); height: var(--rh);
    background: var(--label-bg); color: var(--label-fg);
    text-align: left; padding: 0 14px; font-size: 13.5px; font-weight: 600; letter-spacing: .01em;
    border-color: transparent;
  }
  .sheet thead th.corner, .sheet thead tr.labels th:first-child { left: 0; z-index: 5; padding: 0; }
  .sheet thead th.is-active { background: var(--head-active); color: var(--accent); }

  .sheet td.rn, .sheet thead th.corner {
    position: sticky; left: 0; z-index: 2;
    background: var(--head); color: var(--head-text);
    text-align: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .sheet tbody tr.is-active td.rn { background: var(--head-active); color: var(--accent); font-weight: 700; }

  .sheet td.nm input {
    display: block; width: 100%; height: var(--rh); padding: 0 14px;
    border: 0; border-radius: 0; outline: 0; background: transparent;
    color: var(--text); font: 500 14.5px var(--font);
  }
  .sheet td.nm input::placeholder { color: transparent; }
  .sheet td.nm input:focus::placeholder { color: var(--dim); font-weight: 400; }
  .sheet tbody tr:hover td.nm { background: var(--hover); }
  .sheet td.nm input:focus, .sheet td.st select:focus { box-shadow: inset 0 0 0 2px var(--accent); }

  .sheet td.st { position: relative; }
  .sheet td.st::after {
    content: ""; position: absolute; right: 15px; top: 50%; width: 6px; height: 6px;
    border-right: 1.6px solid var(--dim); border-bottom: 1.6px solid var(--dim);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  .sheet td.st select {
    display: block; width: 100%; height: var(--rh); padding: 0 34px 0 14px;
    border: 0; border-radius: 0; outline: 0; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background: transparent; color: var(--dim); font: 400 14px var(--font);
  }
  .sheet td.st select[data-s="call"] { background: var(--call-bg); color: var(--call-fg); font-weight: 600; }
  .sheet td.st select[data-s="soon"] { background: var(--soon-bg); color: var(--soon-fg); font-weight: 600; }
  .sheet td.st select[data-s="done"] { background: var(--done-bg); color: var(--done-fg); font-weight: 600; }
  .sheet td.st select option { background: var(--sheet); color: var(--text); font-weight: 500; }

  /* ---------- Status bar (bottom, like Excel) ---------- */
  .statusbar {
    height: 36px; flex: none; display: flex; align-items: stretch; justify-content: space-between; gap: 12px;
    background: var(--bar); color: var(--bar-fg); font-size: 12.5px;
  }
  .tab {
    display: flex; align-items: center; padding: 0 20px; margin-left: 10px;
    background: var(--sheet); color: var(--accent); font-weight: 700; font-size: 13px;
    border-top: 3px solid var(--accent);
  }
  .status-right { display: flex; align-items: center; gap: 18px; padding-right: 14px; min-width: 0; }
  .status-right span { white-space: nowrap; }
  #saved.err { color: #ffb4a8; font-weight: 600; }
  #saved.pulse { animation: pulse .7s ease-out; }
  @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }

  /* ---------- Dialog & toast ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.55); }
  .dialog {
    width: 100%; max-width: 430px; padding: 24px; border-radius: 12px;
    background: var(--sheet); color: var(--text); border: 1px solid var(--edge);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.7);
  }
  .dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  .dialog p { margin: 0 0 22px; font-size: 14.5px; line-height: 1.55; color: var(--dim); }
  .dactions { display: flex; justify-content: flex-end; gap: 10px; }
  .dialog .btn { background: var(--head); color: var(--text); border-color: var(--grid); }
  .dialog .btn:hover { background: var(--head-active); }
  .dialog .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .dialog .btn.primary:hover { filter: brightness(.92); background: var(--accent); }
  .dialog .btn.danger { background: #c53a2b; color: #fff; border-color: transparent; }
  .dialog .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: 60px; z-index: 60; transform: translate(-50%, 12px);
    padding: 10px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 500; max-width: calc(100% - 32px);
    background: var(--btn-primary-bg); color: var(--btn-primary-fg);
    box-shadow: 0 10px 30px -8px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Small screens ---------- */
  @media (max-width: 640px) {
    .app { padding: 12px 10px 12px; gap: 10px; }
    .actions { width: 100%; }
    .actions .btn.primary, .actions .btn:not(.icon-btn) { flex: 1; padding: 0 8px; }
    .namebox { display: none; }
    .sheet td.nm input { font-size: 16px; }
    .tip { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="titlebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M10 4v16"/></svg>
      </div>
      <div>
        <h1>Booking Sheet</h1>
        <p id="todayLabel"></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn icon-btn" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Light / dark mode">
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn" id="csvBtn" type="button">Export CSV</button>
      <button class="btn primary" id="xlsxBtn" type="button">Export Excel</button>
      <button class="btn" id="clearBtn" type="button">New day</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden role="status">
    <span id="bannerText"></span>
    <button id="bannerX" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <div class="toolbar">
    <div class="namebox" id="nameBox" aria-hidden="true">A1</div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search customer or booking ID" autocomplete="off" aria-label="Search customer or booking ID">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter by status">
      <button class="chip" type="button" data-f="all" aria-pressed="true">All <span class="n" id="n-all">0</span></button>
      <button class="chip" type="button" data-f="call" aria-pressed="false"><span class="dot"></span>Take on call <span class="n" id="n-call">0</span></button>
      <button class="chip" type="button" data-f="soon" aria-pressed="false"><span class="dot"></span>They will book soon <span class="n" id="n-soon">0</span></button>
      <button class="chip" type="button" data-f="done" aria-pressed="false"><span class="dot"></span>Booking done <span class="n" id="n-done">0</span></button>
    </div>
  </div>

  <main class="book">
    <div class="sheet-wrap" id="sheetWrap">
      <table class="sheet" id="sheet">
        <colgroup><col style="width:56px"><col><col style="width:250px"></colgroup>
        <thead>
          <tr class="letters"><th class="corner"></th><th id="thA">A</th><th id="thB">B</th></tr>
          <tr class="labels"><th></th><th>Customer name / Booking ID</th><th>Status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <footer class="statusbar">
      <div class="tab">Today</div>
      <div class="status-right">
        <span class="tip">Status cell: press 1, 2 or 3</span>
        <span id="showing"></span>
        <span id="used"></span>
        <span id="saved">Auto-save on</span>
      </div>
    </footer>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-describedby="dText">
    <h2 id="dTitle"></h2>
    <p id="dText"></p>
    <div class="dactions">
      <button class="btn" id="dCancel" type="button"></button>
      <button class="btn primary" id="dOk" type="button"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const ROWS = 200;
  const STATUS = { call: 'Take on call', soon: 'They will book soon', done: 'Booking done' };
  const KEY = 'ttbs_sheet_v1';
  const THEME_KEY = 'ttbs_theme_v1';
  const STALE_HOURS = 16;

  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pretty = (d) => d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  /* ---------------- State ---------------- */
  // started = time the first entry of the day was added (used for file name + stale-data warning)
  const state = { started: 0, rows: Array.from({ length: ROWS }, () => ['', '']) };
  let filter = 'all';
  let query = '';

  const hasData = () => state.rows.some((r) => r[0].trim() || r[1]);

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (!d || !Array.isArray(d.rows)) return;
      state.started = Number(d.started) || 0;
      d.rows.slice(0, ROWS).forEach((r, i) => {
        if (!Array.isArray(r)) return;
        state.rows[i][0] = String(r[0] == null ? '' : r[0]).slice(0, 80);
        state.rows[i][1] = STATUS[r[1]] ? r[1] : '';
      });
    } catch (e) { /* ignore corrupt data */ }
  }

  const savedEl = $('#saved');
  function save() {
    try {
      if (hasData()) { if (!state.started) state.started = Date.now(); } else { state.started = 0; }
      localStorage.setItem(KEY, JSON.stringify(state));
      const t = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      savedEl.textContent = 'Saved ' + t;
      savedEl.classList.remove('err');
      savedEl.classList.remove('pulse'); void savedEl.offsetWidth; savedEl.classList.add('pulse');
    } catch (e) {
      savedEl.textContent = 'Not saved: browser storage is blocked';
      savedEl.classList.add('err');
    }
  }

  /* ---------------- Build grid ---------------- */
  const tbody = $('#rows');
  const optionsHtml = '<option value="">Select status</option>' +
    Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < ROWS; i++) {
    const tr = document.createElement('tr');
    tr.dataset.i = i;
    tr.innerHTML =
      `<td class="rn">${i + 1}</td>` +
      `<td class="nm"><input type="text" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Name or booking ID" aria-label="Customer name or booking ID, row ${i + 1}"></td>` +
      `<td class="st"><select aria-label="Status, row ${i + 1}">${optionsHtml}</select></td>`;
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
  const trs = Array.from(tbody.children);

  function paintValues() {
    trs.forEach((tr, i) => {
      tr.querySelector('input').value = state.rows[i][0];
      const sel = tr.querySelector('select');
      sel.value = state.rows[i][1];
      sel.dataset.s = state.rows[i][1];
    });
  }

  /* ---------------- Stats & filter ---------------- */
  function stats() {
    const c = { call: 0, soon: 0, done: 0 };
    let used = 0;
    state.rows.forEach((r) => { if (r[1]) c[r[1]]++; if (r[0].trim() || r[1]) used++; });
    $('#n-all').textContent = used;
    $('#n-call').textContent = c.call;
    $('#n-soon').textContent = c.soon;
    $('#n-done').textContent = c.done;
    $('#used').textContent = `${used} of ${ROWS} rows used`;
  }

  function applyFilter() {
    const q = query.trim().toLowerCase();
    const filtering = filter !== 'all' || q !== '';
    let shown = 0;
    trs.forEach((tr, i) => {
      const [v, s] = state.rows[i];
      const ok = (filter === 'all' || s === filter) && (q === '' || v.toLowerCase().includes(q));
      const visible = !filtering || ok;
      tr.hidden = !visible;
      if (visible) shown++;
    });
    $('#showing').textContent = filtering ? (shown ? `Showing ${shown} matching` : 'No matching rows') : '';
  }

  /* ---------------- Editing ---------------- */
  tbody.addEventListener('input', (e) => {
    if (!e.target.matches('input')) return;
    const i = +e.target.closest('tr').dataset.i;
    state.rows[i][0] = e.target.value;
    save(); stats();
  });

  tbody.addEventListener('change', (e) => {
    if (!e.target.matches('select')) return;
    const i = +e.target.closest('tr').dataset.i;
    state.rows[i][1] = e.target.value;
    e.target.dataset.s = e.target.value;
    save(); stats();
  });

  function sibling(tr, dir) {
    let n = dir > 0 ? tr.nextElementSibling : tr.previousElementSibling;
    while (n && n.hidden) n = dir > 0 ? n.nextElementSibling : n.previousElementSibling;
    return n;
  }
  const STATUS_KEYS = { '1': 'call', '2': 'soon', '3': 'done', '0': '', 'Backspace': '', 'Delete': '' };

  tbody.addEventListener('keydown', (e) => {
    const t = e.target, tr = t.closest('tr');
    if (!tr) return;
    if (t.matches('input')) {
      if (e.key === 'Enter' || e.key === 'ArrowDown') {
        const n = sibling(tr, 1);
        if (n) { e.preventDefault(); n.querySelector('input').focus(); }
      } else if (e.key === 'ArrowUp') {
        const n = sibling(tr, -1);
        if (n) { e.preventDefault(); n.querySelector('input').focus(); }
      } else if (e.key === 'ArrowRight' && t.selectionStart === t.value.length && t.selectionEnd === t.value.length) {
        e.preventDefault(); tr.querySelector('select').focus();
      }
    } else if (t.matches('select')) {
      if (Object.prototype.hasOwnProperty.call(STATUS_KEYS, e.key)) {
        e.preventDefault();
        t.value = STATUS_KEYS[e.key];
        t.dispatchEvent(new Event('change', { bubbles: true }));
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault(); tr.querySelector('input').focus();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const n = sibling(tr, 1);
        if (n) n.querySelector('input').focus();
      }
    }
  });

  // Highlight the active row number / column letter, and show the cell address
  let activeTr = null;
  tbody.addEventListener('focusin', (e) => {
    const tr = e.target.closest('tr');
    if (!tr) return;
    const colA = e.target.matches('input');
    if (activeTr) activeTr.classList.remove('is-active');
    activeTr = tr; tr.classList.add('is-active');
    $('#thA').classList.toggle('is-active', colA);
    $('#thB').classList.toggle('is-active', !colA);
    $('#nameBox').textContent = (colA ? 'A' : 'B') + (+tr.dataset.i + 1);
  });

  /* ---------------- Search & filter chips ---------------- */
  $('#search').addEventListener('input', (e) => { query = e.target.value; applyFilter(); });
  $('#chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
    applyFilter();
  });

  /* ---------------- Theme ---------------- */
  const themeBtn = $('#themeBtn');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  themeBtn.addEventListener('click', () => {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

  /* ---------------- Toast & dialog ---------------- */
  const toastEl = $('#toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  const overlay = $('#overlay'), dOk = $('#dOk'), dCancel = $('#dCancel');
  function ask({ title, text, ok, cancel, danger, focusOk }) {
    return new Promise((resolve) => {
      $('#dTitle').textContent = title;
      $('#dText').textContent = text;
      dOk.textContent = ok; dCancel.textContent = cancel;
      dOk.classList.toggle('danger', !!danger);
      const prev = document.activeElement;
      overlay.hidden = false;
      (focusOk ? dOk : dCancel).focus();
      const done = (val) => {
        overlay.hidden = true;
        overlay.onkeydown = null; dOk.onclick = null; dCancel.onclick = null;
        if (prev && prev.focus) prev.focus();
        resolve(val);
      };
      dOk.onclick = () => done(true);
      dCancel.onclick = () => done(false);
      overlay.onkeydown = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); done(false); }
        if (e.key === 'Tab') {
          e.preventDefault();
          (document.activeElement === dOk ? dCancel : dOk).focus();
        }
      };
    });
  }

  /* ---------------- Export ---------------- */
  const entries = () => {
    const out = [];
    state.rows.forEach(([v, s]) => { if (v.trim() || s) out.push([v.trim(), STATUS[s] || '']); });
    return out;
  };
  // File date = day the first entry was added, so exporting just after midnight keeps the shift's date
  const fileName = (ext) => `Booking_Data_${isoDate(state.started ? new Date(state.started) : new Date())}.${ext}`;

  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function csvCell(v) {
    v = String(v);
    // Keep leading zeros / long IDs intact when the CSV is opened in Excel
    if (/^(0\d+|\d{11,})$/.test(v)) return `="${v}"`;
    return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  }
  function csvBlob(list) {
    const lines = [['Sr No', 'Customer Name / Booking ID', 'Status'].map(csvCell).join(',')];
    list.forEach(([v, s], i) => lines.push([i + 1, v, s].map(csvCell).join(',')));
    return new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  }

  // --- Minimal .xlsx writer (no libraries): XML parts packed in an uncompressed zip ---
  const crcTable = (() => {
    const t = [];
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = (buf) => { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

  function makeZip(files) {
    const enc = new TextEncoder(), chunks = [], central = [];
    const d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    let offset = 0;
    files.forEach((f) => {
      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, time, true); lh.setUint16(12, date, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      chunks.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    });
    const cdSize = central.reduce((n, c) => n + c.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...chunks, ...central, new Uint8Array(end.buffer)],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  const xmlEsc = (s) => String(s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/[<>&"']/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c]));
  const strCell = (ref, text, style) =>
    `<c r="${ref}" t="inlineStr"${style ? ` s="${style}"` : ''}><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;

  function xlsxBlob(list) {
    const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
    const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    let rowsXml = `<row r="1">${strCell('A1', 'Sr No', 1)}${strCell('B1', 'Customer Name / Booking ID', 1)}${strCell('C1', 'Status', 1)}</row>`;
    list.forEach(([v, s], i) => {
      const r = i + 2;
      rowsXml += `<row r="${r}"><c r="A${r}"><v>${i + 1}</v></c>${strCell('B' + r, v)}${strCell('C' + r, s)}</row>`;
    });
    const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
      `<cols><col min="1" max="1" width="8" customWidth="1"/><col min="2" max="2" width="42" customWidth="1"/><col min="3" max="3" width="26" customWidth="1"/></cols>` +
      `<sheetData>${rowsXml}</sheetData></worksheet>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>` +
      `<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1A6D45"/><bgColor indexed="64"/></patternFill></fill></fills>` +
      `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>` +
      `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>` +
      `<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`;
    const head = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`;
    return makeZip([
      { name: '[Content_Types].xml', data: head + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
      { name: '_rels/.rels', data: head + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: head + `<workbook xmlns="${NS}" xmlns:r="${RNS}"><sheets><sheet name="Booking Data" sheetId="1" r:id="rId1"/></sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', data: head + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/worksheets/sheet1.xml', data: sheet },
      { name: 'xl/styles.xml', data: styles }
    ]);
  }

  /* ---------------- Export flow & clearing ---------------- */
  function clearAll() {
    state.rows = Array.from({ length: ROWS }, () => ['', '']);
    state.started = 0;
    filter = 'all'; query = '';
    $('#search').value = '';
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.f === 'all')));
    paintValues(); applyFilter(); stats(); save();
    $('#banner').hidden = true;
    const first = trs[0].querySelector('input');
    first.focus();
  }

  async function doExport(kind) {
    const list = entries();
    if (!list.length) { toast('Nothing to export yet. Add a customer first.'); return; }
    const name = fileName(kind);
    download(kind === 'csv' ? csvBlob(list) : xlsxBlob(list), name);
    const clear = await ask({
      title: 'Export complete',
      text: `${list.length} ${list.length === 1 ? 'entry' : 'entries'} saved as ${name}. Check that the file downloaded, then clear the sheet to start a fresh day.`,
      ok: 'Clear sheet', cancel: 'Keep data', focusOk: true
    });
    if (clear) { clearAll(); toast('Sheet cleared. Ready for a new day.'); }
  }

  $('#csvBtn').addEventListener('click', () => doExport('csv'));
  $('#xlsxBtn').addEventListener('click', () => doExport('xlsx'));

  $('#clearBtn').addEventListener('click', async () => {
    if (!hasData()) { toast('The sheet is already empty.'); return; }
    const yes = await ask({
      title: 'Start a new day?',
      text: 'This removes every entry from this sheet. Export first if you still need today\u2019s data.',
      ok: 'Clear sheet', cancel: 'Cancel', danger: true
    });
    if (yes) { clearAll(); toast('Sheet cleared. Ready for a new day.'); }
  });

  /* ---------------- Init ---------------- */
  function updateDateLabel() { $('#todayLabel').textContent = pretty(new Date()); }
  updateDateLabel();
  setInterval(updateDateLabel, 60000);

  load();
  paintValues();
  stats();
  applyFilter();

  if (hasData() && state.started && (Date.now() - state.started) > STALE_HOURS * 3600 * 1000) {
    $('#bannerText').textContent = `This sheet still has entries from ${pretty(new Date(state.started))}. Export them, then clear the sheet to start today fresh.`;
    $('#banner').hidden = false;
  }
  $('#bannerX').addEventListener('click', () => { $('#banner').hidden = true; });
})();
</script>
</body>
</html>
